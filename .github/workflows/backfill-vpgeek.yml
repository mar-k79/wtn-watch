name: Backfill neuron history from vpGeek

# one-off (vpGeek shuts down 2026-12-31): imports historic maturity/stake changes of known/public neurons
on:
  workflow_dispatch:
    inputs:
      ids:
        description: Neuron IDs (comma/space separated). Empty = all known neurons.
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: archive-neurons
  cancel-in-progress: false

jobs:
  backfill:
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    permissions:
      contents: write
    env:
      IDS: ${{ inputs.ids }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 22
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: node scripts/backfill-vpgeek.mjs
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add neurons/
          git commit -qm "neurons: backfill history from vpGeek" || exit 0
          for i in 1 2 3; do git pull -q --rebase -X theirs && git push -q && break; sleep 5; done
