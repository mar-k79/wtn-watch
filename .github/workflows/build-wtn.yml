name: Reproducible WaterNeuron build

on:
  workflow_dispatch:
    inputs:
      commit:
        description: WaterNeuron/WaterNeuron commit (full 40-char sha)
        required: true

permissions:
  contents: write

concurrency:
  group: build-wtn
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Validate input
        run: echo "${{ inputs.commit }}" | grep -Eq '^[0-9a-f]{40}$'

      - uses: actions/checkout@v5

      - name: Checkout WaterNeuron
        uses: actions/checkout@v5
        with:
          repository: WaterNeuron/WaterNeuron
          ref: ${{ inputs.commit }}
          path: wn

      - uses: DeterminateSystems/nix-installer-action@main

      - name: Build with Nix
        working-directory: wn
        run: ./build.sh

      - name: Write hashes
        env:
          COMMIT: ${{ inputs.commit }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          cd wn/artifacts
          sha256sum *.wasm.gz | tee ../../hashes.txt
          cd ../..
          python3 - << 'PY'
          import json, os, datetime
          wasms = {}
          for line in open('hashes.txt'):
              h, name = line.split()
              wasms[name.replace('.wasm.gz', '')] = h
          out = {
              'commit': os.environ['COMMIT'],
              'built_at': datetime.datetime.utcnow().replace(microsecond=0).isoformat() + 'Z',
              'run_url': os.environ['RUN_URL'],
              'runner': 'ubuntu-22.04 + nix',
              'wasms': wasms,
          }
          os.makedirs('builds', exist_ok=True)
          json.dump(out, open(f"builds/{os.environ['COMMIT']}.json", 'w'), indent=2)
          PY

      - name: Rebuild index
        run: |
          python3 - << 'PY'
          import json, glob, os
          idx = {}
          for f in sorted(glob.glob('builds/*.json')):
              if os.path.basename(f) == 'index.json':
                  continue
              b = json.load(open(f))
              for name, h in b['wasms'].items():
                  idx[h] = {'commit': b['commit'], 'canister': name, 'run_url': b['run_url']}
          json.dump(idx, open('builds/index.json', 'w'), indent=2, sort_keys=True)
          PY

      - name: Commit result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add builds/
          git commit -m "build: WaterNeuron ${{ inputs.commit }}" || exit 0
          for i in 1 2 3; do git pull --rebase -X theirs && git push && break; sleep 5; done
