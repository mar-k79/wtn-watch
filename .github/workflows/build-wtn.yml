name: Reproducible WaterNeuron build

on:
  workflow_dispatch:
    inputs:
      commit:
        description: WaterNeuron/WaterNeuron commit (full 40-char sha)
        required: true

# least privilege: read by default, write only in the job that commits results
permissions:
  contents: read

concurrency:
  group: build-wtn
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    env:
      COMMIT: ${{ inputs.commit }}
    steps:
      # input goes through env, never interpolated into the script (no shell injection)
      - name: Validate input
        run: printf '%s' "$COMMIT" | grep -Eqx '[0-9a-f]{40}'

      # actions pinned to full commit SHAs (supply-chain safety)
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true

      - name: Checkout WaterNeuron
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: WaterNeuron/WaterNeuron
          ref: ${{ inputs.commit }}
          path: wn
          fetch-depth: 0
          persist-credentials: false

      # a SHA from a fork can be checked out through the parent repo — record whether it is really in official history
      - name: Check commit is on an official branch
        working-directory: wn
        run: |
          git fetch -q origin '+refs/heads/*:refs/remotes/origin/*'
          if [ -n "$(git branch -r --contains "$COMMIT" 2>/dev/null)" ]; then echo "ON_BRANCH=true" >> "$GITHUB_ENV"; else echo "ON_BRANCH=false" >> "$GITHUB_ENV"; fi
          git merge-base --is-ancestor "$COMMIT" origin/main && echo "ON_MAIN=true" >> "$GITHUB_ENV" || echo "ON_MAIN=false" >> "$GITHUB_ENV"

      - uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23

      - name: Build with Nix
        working-directory: wn
        run: ./build.sh

      - name: Write hashes
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          cd wn/artifacts
          sha256sum *.wasm.gz | tee ../../hashes.txt
          cd ../..
          python3 - << 'PY'
          import json, os, datetime
          wasms = {}
          for line in open('hashes.txt'):
              h, name = line.split()
              wasms[name.replace('.wasm.gz', '')] = h
          out = {
              'commit': os.environ['COMMIT'],
              'built_at': datetime.datetime.utcnow().replace(microsecond=0).isoformat() + 'Z',
              'run_url': os.environ['RUN_URL'],
              'runner': 'ubuntu-22.04 + nix',
              'wasms': wasms,
              'on_main': os.environ.get('ON_MAIN') == 'true',
              'on_branch': os.environ.get('ON_BRANCH') == 'true',
          }
          os.makedirs('builds', exist_ok=True)
          json.dump(out, open(f"builds/{os.environ['COMMIT']}.json", 'w'), indent=2)
          PY

      - name: Rebuild index
        run: |
          python3 - << 'PY'
          import json, glob, os
          idx = {}
          for f in sorted(glob.glob('builds/*.json')):
              if os.path.basename(f) == 'index.json':
                  continue
              b = json.load(open(f))
              for name, h in b['wasms'].items():
                  idx[h] = {'commit': b['commit'], 'canister': name, 'run_url': b['run_url'], 'on_branch': b.get('on_branch', True)}
          json.dump(idx, open('builds/index.json', 'w'), indent=2, sort_keys=True)
          PY

      - name: Commit result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add builds/
          git commit -m "build: WaterNeuron $COMMIT" || exit 0
          for i in 1 2 3; do git pull --rebase -X theirs && git push && break; sleep 5; done
